# Postgres local para desarrollo y pruebas.
#
# Existe para que ni `npm run dev` ni los tests tengan que apuntar a una base
# remota: producción se alcanza solo a propósito (ver docs/runbooks/bases-de-datos.md).
# Levanta dos bases sobre el mismo servidor —`notoriovs_dev` y `notoriovs_test`—
# porque los tests borran y crean registros, y no deben pisar lo que traes a
# medias en el admin local.
#
#   npm run db:up      # levanta el servidor
#   npm run db:reset   # tira las dos bases y las reconstruye con las migraciones
#
# Las credenciales son deliberadamente triviales: este servidor solo escucha en
# tu máquina y no contiene datos de nadie.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: notoriovs
      POSTGRES_PASSWORD: notoriovs
      POSTGRES_DB: notoriovs_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Solo corre la primera vez, cuando el volumen está vacío.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notoriovs -d notoriovs_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
